d{min-height:270px;padding:24px;overflow:hidden;position:relative}.grid .card:after{content:"";position:absolute;width:150px;height:150px;border:28px solid #0066ff0d;border-radius:50%;right:-60px;top:-70px}.label{text-transform:uppercase;letter-spacing:.15em;font-size:.72rem;font-weight:900;color:#4f6e95}.position{background:linear-gradient(150deg,#061a3a,#0a3166);color:#fff;border-color:#18457e}.position .label{color:#8fbcff}.big{margin-top:14px;line-height:.8;display:flex}.big b{font-size:8.4rem;font-weight:950;letter-spacing:-.09em}.big sup{font-weight:900;font-size:1.5rem;margin:12px 0 0 6px;color:#75aaff}.position>p{margin:5px 0 14px;color:#a9c4e7;font-weight:700}.ticks{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}.ticks i{height:5px;border-radius:9px;background:#31527a}.ticks i.on{background:#fff;box-shadow:0 0 14px #66a1ff}.leader{display:flex;justify-content:space-between;margin-top:18px;font-size:.78rem;color:#a9c4e7}.leader b{color:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:31px}.stats div{border-right:1px solid var(--line);padding-right:12px;margin-right:16px}.stats div:last-child{border:0}.stats b{display:block;font-size:3.2rem;line-height:1;letter-spacing:-.06em}.stats .pos{color:var(--blue)}.stats span{display:block;font-size:.65rem;font-weight:900;letter-spacing:.12em;color:#7087a5;margin-top:8px}.totals{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:25px;padding-top:17px;color:#7790ad;font-size:.65rem;font-weight:900;letter-spacing:.1em}.totals b{display:block;color:var(--ink);font-size:1rem;letter-spacing:0;margin-top:4px}.title-card{background:linear-gradient(135deg,#fff 50%,#edf5ff)}.target{display:flex;align-items:center;gap:18px;margin-top:22px}.target b{font-size:5.1rem;line-height:.9;color:var(--blue);letter-spacing:-.08em}.target span{font-size:.9rem;line-height:1.45;font-weight:800}.bar{height:12px;border-radius:99px;background:#dce9f8;overflow:hidden;margin:22px 0 15px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#063477,#0d74ff);border-radius:inherit;box-shadow:0 0 18px #1a79ff}.equation{display:flex;justify-content:space-between;font-size:.72rem;color:#6d83a0;gap:12px}.equation b{color:var(--ink);font-size:.9rem}.note{font-size:.72rem;color:#7287a2;line-height:1.45;margin:17px 0 0}.movement-card{padding:24px;margin-bottom:16px}.movement-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.movement-head h2{font-size:clamp(1.45rem,2.6vw,2.15rem);letter-spacing:-.045em;margin:5px 0 0}.movement-key{text-align:right;font-size:.72rem;color:#6d83a0}.movement-key b{display:block;color:#0672ff;font-size:.82rem;margin-top:4px}.movement-wrap{overflow-x:auto;border-radius:18px;background:linear-gradient(145deg,#061a3a,#092b58);box-shadow:inset 0 0 0 1px #ffffff12}.movement{display:block;min-width:850px;width:100%;height:auto}.movement line{stroke:#93b5df25;stroke-width:1}.movement text{fill:#8faed2;font:700 14px Arial}.movement .week{fill:#b8cbe2;font-size:13px}.movement polyline{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;opacity:.82}.movement circle{fill:#061a3a;stroke:currentColor;stroke-width:2.5}.movement .team-label{fill:currentColor;font-size:12px}.movement .ox-line{filter:drop-shadow(0 0 7px #1683ff)}.movement .ox-line .team-label{font-size:14px;font-weight:900}.movement-note{font-size:.72rem;color:#7087a5;margin:12px 2px 0}.table-card{padding:24px 24px 12px}.heading{display:flex;justify-content:space-between;align-items:end;padding:2px 2px 20px}.heading h1{margin:5px 0 0;font-size:clamp(1.55rem,3vw,2.45rem);letter-spacing:-.045em}.refresh{text-align:right;font-size:.72rem;color:#7790ad}.refresh span,.refresh b{display:block}.refresh span{text-transform:uppercase;letter-spacing:.12em;font-weight:900}.refresh b{color:var(--ink);font-size:.82rem;margin-top:4px}.wrap{overflow-x:auto;border-radius:16px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:760px;font-size:.86rem}th{text-align:center;color:#7087a5;font-size:.68rem;letter-spacing:.12em;padding:13px 11px;background:#f2f7fd}th:nth-child(2),td:nth-child(2){text-align:left}td{padding:11px;text-align:center;border-top:1px solid #e4edf8;font-variant-numeric:tabular-nums}.rank{width:25px;height:25px;display:inline-grid;place-items:center;border-radius:8px;font-weight:900;color:#617794}.team{font-weight:800;white-space:nowrap}.dot{width:9px;height:9px;background:var(--blue);border-radius:50%;box-shadow:0 0 0 4px #dbeaff;display:inline-block;margin-right:10px}.ox{background:linear-gradient(90deg,#eaf3ff,#f8fbff);color:#002e70}.ox td{border-color:#c8ddf8;font-weight:800}.ox .rank{background:var(--blue);color:#fff;box-shadow:0 5px 12px #0066ff40}footer{display:flex;justify-content:space-between;gap:20px;color:#6380a2;font-size:.72rem;padding:18px 4px 0}footer p{margin:0}footer a{font-weight:800;color:#164f98;text-underline-offset:3px}.loading{display:grid;place-items:center;min-height:75vh;font-weight:900;color:#386696}.error{padding:14px;border-radius:14px;background:#fff3f3;color:#9b2838;margin-bottom:16px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:980px){.grid{grid-template-columns:1fr 1fr}.title-card{grid-column:1/-1}.grid .card{min-height:245px}}@media(max-width:650px){main{width:calc(100% - 20px);padding-top:14px}.brand strong{font-size:.8rem;letter-spacing:.08em}.brand small{display:block;font-size:.54rem;letter-spacing:.06em}.crest{width:44px;height:44px;flex-basis:44px}.live{font-size:.6rem;padding:8px 9px}.grid{grid-template-columns:1fr;gap:10px}.title-card{grid-column:auto}.grid .card{min-height:auto;padding:21px;border-radius:19px}.big b{font-size:7rem}.movement-card{padding:20px 12px}.movement-head{align-items:start;padding:0 5px}.movement-key{max-width:125px}.table-card{padding:18px 12px 10px;border-radius:19px}.heading{align-items:start}.refresh{max-width:130px}.stats b{font-size:2.7rem}.equation{flex-direction:column}.target b{font-size:4.4rem}footer{flex-direction:column;padding:15px 5px 6px}}@media(prefers-reduced-motion:no-preference){.big,.target b{animation:rise .65s cubic-bezier(.2,.8,.2,1) both}.ox{animation:flash 1s ease .25s both}@keyframes rise{from{opacity:0;transform:translateY(14px)}}@keyframes flash{from{background:#cfe4ff}}}

<body>
  <main id="app"><div class="loading">Loading Oxford 2’s standings…</div></main>
  <script>
    const SOURCE_URL="https://www.oxfordhc.org/teams/259935/league-table?tableId=191993";
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const ordinal=n=>n%10===1&&n%100!==11?"st":n%10===2&&n%100!==12?"nd":n%10===3&&n%100!==13?"rd":"th";
    function chart(s){const history=s.history||[],W=1100,H=520,L=58,R=190,T=34,B=58,x=i=>L+(W-L-R)*(history.length===1?.5:i/(history.length-1)),y=p=>T+(p-1)*(H-T-B)/11,palette=["#4ec5ff","#ffb84c","#5de0a1","#fa7898","#9d8cff","#f37f49","#66d3d8","#e6db74","#b484ff","#ff8ed8","#7e9eff"],grid=Array.from({length:12},(_,i)=>`<line x1="${L}" y1="${y(i+1)}" x2="${W-R}" y2="${y(i+1)}"/><text x="${L-22}" y="${y(i+1)+5}">${i+1}</text>`).join(""),weeks=history.map((h,i)=>`<text class="week" x="${x(i)}" y="${H-20}" text-anchor="middle">${new Intl.DateTimeFormat("en-GB",{day:"numeric",month:"short"}).format(new Date(`${h.date}T12:00:00Z`))}</text>`).join(""),lines=s.teams.map((team,index)=>{const points=history.map((h,i)=>`${x(i)},${y(h.positions[team.name]??team.position)}`).join(" "),colour=team.name==="Oxford 2"?"#ffffff":palette[index%palette.length],width=team.name==="Oxford 2"?6:2.5,dots=history.map((h,i)=>`<circle cx="${x(i)}" cy="${y(h.positions[team.name]??team.position)}" r="${team.name==="Oxford 2"?6:3.5}"/>`).join("");return `<g class="${team.name==="Oxford 2"?"ox-line":""}" style="color:${colour}"><polyline points="${points}" stroke-width="${width}"/>${dots}<text class="team-label" x="${W-R+14}" y="${y(team.position)+5}">${esc(team.name)}</text></g>`}).join("");return `<svg class="movement" viewBox="0 0 ${W} ${H}" role="img" aria-label="Line graph showing every team’s league position by week"><g>${grid}</g>${weeks}${lines}</svg>`}
    function render(s,warning=""){const o=s.teams.find(t=>t.name==="Oxford 2"),leader=s.teams[0],season=22,left=Math.max(0,season-o.played),available=left*3,rival=Math.max(...s.teams.filter(t=>t.name!=="Oxford 2").map(t=>t.points+(season-t.played)*3)),needed=Math.max(0,rival+1-o.points),help=Math.max(0,needed-available),progress=Math.min(100,Math.round(o.points/Math.max(1,o.points+needed)*100)),updated=new Intl.DateTimeFormat("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",timeZone:"Europe/London"}).format(new Date(s.fetchedAt)),rows=s.teams.map(t=>`<tr class="${t.name==="Oxford 2"?"ox":""}"><td><span class="rank">${t.position}</span></td><td><span class="team">${t.name==="Oxford 2"?'<i class="dot"></i>':""}${esc(t.name)}</span></td><td>${t.played}</td><td>${t.won}</td><td>${t.drawn}</td><td>${t.lost}</td><td>${t.for}</td><td>${t.against}</td><td>${t.difference>0?"+":""}${t.difference}</td><td><b>${t.points}</b></td></tr>`).join("");document.querySelector("#app").innerHTML=`<header class="mast"><a class="brand" href="https://www.oxfordhc.org/teams/259935/fixtures-results" target="_blank" rel="noreferrer"><span class="crest">O</span><span><strong>OXFORD HOCKEY CLUB</strong><small>MEN’S 2ND XI · LEAGUE DASHBOARD</small></span></a><div class="live">2026/27 LIVE</div></header>${warning?`<div class="error">${esc(warning)}</div>`:""}<section class="grid"><article class="position card"><div class="label">League position</div><div class="big"><b>${o.position}</b><sup>${ordinal(o.position)}</sup></div><p>of ${s.teams.length} teams</p><div class="ticks">${s.teams.map(t=>`<i class="${t.name==="Oxford 2"?"on":""}"></i>`).join("")}</div><div class="leader"><span>${esc(leader.name)}</span><b>${leader.points-o.points} pts ahead</b></div></article><article class="card"><div class="label">Oxford at a glance</div><div class="stats"><div><b>${o.points}</b><span>POINTS</span></div><div><b>${o.won}</b><span>WINS</span></div><div><b class="pos">${o.difference>0?"+":""}${o.difference}</b><span>GOAL DIFF</span></div></div><div class="totals"><span>PLAYED<b>${o.played}</b></span><span>GOALS FOR<b>${o.for}</b></span><span>GOALS AGAINST<b>${o.against}</b></span></div></article><article class="title-card card"><div class="label">Title equation</div><div class="target"><b>${needed}</b><span>more points needed to guarantee<br>an outright league title</span></div><div class="bar"><i style="width:${progress}%"></i></div><div class="equation"><span><b>${available}</b> points available</span><span><b>${help}</b> must be dropped by rivals</span></div><p class="note">This is the strict mathematical target today, not a prediction. It falls as rivals drop points.</p></article></section><section class="movement-card card"><div class="movement-head"><div><div class="label">League journey</div><h2>Position by match week</h2></div><div class="movement-key">1st is at the top<b>Oxford in white</b></div></div><div class="movement-wrap">${chart(s)}</div><p class="movement-note">On a phone, swipe sideways to explore. Each Saturday refresh adds a new point.</p></section><section class="table-card card"><div class="heading"><div><div class="label">South Central Open</div><h1>Men’s Division 1 North</h1></div><div class="refresh"><span>Weekly refresh</span><b>Saturdays · 23:59 UK</b></div></div><div class="wrap"><table><thead><tr><th>POS</th><th>TEAM</th><th>PL</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>PTS</th></tr></thead><tbody>${rows}</tbody></table></div></section><footer><p><span class="source-dot"></span>Data source: <a href="${SOURCE_URL}" target="_blank" rel="noreferrer">Oxford HC Men’s 2s</a>, fed by England Hockey GMS</p><p>Updated ${updated} · Latest verified snapshot</p></footer>`}
    async function start(){try{const response=await fetch(`./data.json?v=${Date.now()}`,{cache:"no-store"});if(!response.ok)throw new Error("The latest standings are temporarily unavailable.");render(await response.json())}catch(error){document.querySelector("#app").innerHTML=`<div class="loading">${esc(error.message)} Please try again shortly.</div>`}}start();
  </script>
